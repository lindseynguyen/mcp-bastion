name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff && ruff check --output-format=github .

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        mcp: ["mcp<2", "mcp>=2"]
        exclude:
          - python: "3.10"
            mcp: "mcp>=2"
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "${{ matrix.mcp }}"
      - name: Install semgrep (isolated)
        if: runner.os == 'Linux'
        run: pip install pipx && pipx install semgrep
      - run: python -m pytest -q
      - name: Self-scan the bundled fixtures
        run: python -m mcpbastion scan tests/fixtures/risky_config.json --engines none -o risky.sarif || true
