[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-bastion"
version = "0.4.0"
description = "Offline security scanner for MCP servers and AI-agent tools: tool poisoning, rug pulls, secrets, supply chain and code flaws, mapped to OWASP MCP Top 10 and OWASP Agentic Top 10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nguyen Huu Thien Duc" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "claude-md", "agents-md", "cursor-rules", "ai-security", "llm-security", "agent-security",
            "prompt-injection", "tool-poisoning", "owasp", "sarif"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = ["mcp>=1.9", "httpx>=0.27"]

[project.optional-dependencies]
# Python engines that install cleanly next to the scanner
engines = ["detect-secrets>=1.5", "bandit>=1.7", "pyyaml>=6"]
# ML prompt-injection classifier (pulls in torch + transformers, ~2 GB)
ml = ["llm-guard>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "detect-secrets>=1.5", "bandit>=1.7",
       "pyyaml>=6"]

[project.scripts]
mcp-bastion = "mcpbastion.cli:main"

[project.urls]
Homepage = "https://github.com/lindseynguyen/mcp-bastion"
Issues = "https://github.com/lindseynguyen/mcp-bastion/issues"

[tool.setuptools]
packages = ["mcpbastion", "mcpbastion.rules", "mcpbastion.integrations", "mcpbastion.gui"]

[tool.setuptools.package-data]
"mcpbastion.integrations" = ["semgrep_rules.yml"]
"mcpbastion.gui" = ["index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "tests/fixtures"]

[tool.ruff.lint]
select = ["E9", "F", "B", "S"]
ignore = ["S603", "S607", "S404", "B008", "S110", "S112"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S310"]
